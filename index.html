<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Buddy | School Management & Reminder App</title>
    <meta name="description" content="Book Buddy - School Management & Reminder App, a premium school management and reminder system for Team 3.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="top-nav">
            <div class="nav-brand">
                <div class="logo-section">
                    <div class="logo-icon">📚</div>
                    <h1>Book<span>Buddy</span></h1>
                </div>
            </div>

            <nav class="nav-menu" id="nav-dropdown">
                <button class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </button>
                <button class="nav-item" data-view="admin">
                    <i data-lucide="settings"></i>
                    <span>Admin Panel</span>
                </button>
                <button class="nav-item" data-view="students">
                    <i data-lucide="users"></i>
                    <span>Students</span>
                </button>
                <button class="nav-item" data-view="library">
                    <i data-lucide="book-open"></i>
                    <span>Library</span>
                </button>
                <button class="nav-item" data-view="fees">
                    <i data-lucide="credit-card"></i>
                    <span>Fees</span>
                </button>
                <button class="nav-item" data-view="worksheets">
                    <i data-lucide="file-text"></i>
                    <span>Worksheets</span>
                </button>
                <button class="nav-item" data-view="newspapers">
                    <i data-lucide="newspaper"></i>
                    <span>Newspapers</span>
                </button>
                <button class="nav-item" data-view="blueprint">
                    <i data-lucide="map"></i>
                    <span>Blueprint</span>
                </button>
                <button class="nav-item" data-view="performance">
                    <i data-lucide="bar-chart-2"></i>
                    <span>Performance</span>
                </button>
                <button class="nav-item" onclick="AuthService.logout()" style="color: var(--accent-rose);">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </nav>

            <div class="nav-actions">
                <div class="header-search desktop-only">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <button class="icon-btn" id="theme-btn">
                    <i data-lucide="moon"></i>
                </button>
                <div class="notification-wrapper">
                    <button class="icon-btn" id="notif-btn">
                        <i data-lucide="bell"></i>
                        <span class="notification-badge" id="notif-badge">0</span>
                    </button>
                    <div class="notification-dropdown" id="notif-dropdown">
                        <div class="dropdown-header">
                            <h3>Notifications</h3>
                            <button class="btn-ghost btn-sm" onclick="NotificationSystem.clearAll()">Clear All</button>
                        </div>
                        <div class="dropdown-body" id="notif-items"></div>
                    </div>
                </div>
                <div class="user-card" onclick="switchView('profile', AuthService.getUser().id)" style="cursor: pointer;">
                    <div class="user-avatar" id="nav-user-avatar">AD</div>
                </div>
                <button class="icon-btn" onclick="AuthService.logout()" title="Logout">
                    <i data-lucide="log-out"></i>
                </button>
                <button class="icon-btn" id="menu-toggle">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <div id="view-container" class="view-content fade-in">
                <div class="loading">Loading dashboard...</div>
            </div>
        </main>
    </div>
    
    <div id="sidebar-overlay"></div>

    <!-- Notification Overlay -->
    <div id="toast-container"></div>

    <!-- Services -->
    <script src="src/services/storage.js"></script>
    <script src="src/services/auth.js"></script>
    <script src="src/services/notificationSystem.js"></script>
    
    <!-- Components -->
    <script src="src/components/dashboard.js"></script>
    <script src="src/components/views.js"></script>
    <script src="main.js"></script>
</body>
</html>
